<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>Merci pour ton vote · CrossFit Hygie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
:root{--fond:#F4F4F2;--noir:#0A0B0C;--rouge:#E22118;--gris:#5B626C;--beton:#2F2F32;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{background:var(--beton);color:var(--noir)}
body{font-family:'Archivo',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;
 padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
 background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.2px),radial-gradient(rgba(0,0,0,.25) 1px,transparent 1.2px);background-size:7px 7px,11px 11px}
.p{position:relative;width:100%;max-width:440px;background:#fff;padding:30px 24px 30px;text-align:center;transform:rotate(-.6deg);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.scotch{position:absolute;top:-12px;left:50%;width:110px;height:26px;margin-left:-55px;background:rgba(140,140,136,.85);transform:rotate(-3deg)}
.logo{display:block;width:140px;height:auto;margin:0 auto 18px}
.k{font:800 11.5px 'Archivo',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--gris)}
h1{font-weight:900;font-stretch:62%;text-transform:uppercase;font-size:50px;line-height:.9;margin:10px 0 14px}
.choix{display:inline-block;background:var(--rouge);color:#fff;font-weight:900;font-stretch:75%;text-transform:uppercase;font-size:21px;padding:6px 14px;transform:rotate(-1deg)}
p.t{margin:16px 0 0;font-size:15px;line-height:1.55;color:var(--gris)}
p.t b{color:var(--noir)}
</style></head>
<body><main class="p"><span class="scotch"></span>
<img class="logo" src="hygie-logo.png" alt="CrossFit Hygie">
<p class="k">Compétition interne · dimanche 29 novembre</p>
<h1 id="titre">Merci pour ton vote !</h1>
<p><span class="choix" id="choix" hidden></span></p>
<p class="t" id="texte">Le format qui gagne sera celui de la journée. On annonce le résultat, le programme et les inscriptions début novembre.</p>
</main>
<script>
(function(){
  var FORMATS={individuel:"Individuel",team2:"Team de 2 (HH ou FF)",team2mixte:"Team de 2 mixte",team3:"Team de 3 (HHH ou FFF)",team3mixte:"Team de 3 mixte"};
  var API="https://hygiebot.tail7ef5c3.ts.net/hub/vote/compet-format-2026-11";
  var f=new URLSearchParams(location.search).get("f"), c=document.getElementById("choix");
  function montrer(label,deja){
    if(label){c.textContent="Ton choix : "+label;c.hidden=false;}
    if(deja){document.getElementById("titre").textContent="Tu as déjà voté";
      document.getElementById("texte").innerHTML="<b>Un vote par appareil.</b> Ton premier choix est bien pris en compte. Résultat et programme début novembre.";}
  }
  var ap=null,deja=null;
  try{ap=localStorage.getItem("hygie_appareil");if(!ap){ap=Date.now().toString(36)+Math.random().toString(36).slice(2,12);localStorage.setItem("hygie_appareil",ap);}
      deja=localStorage.getItem("hygie_vote_compet");}catch(e){}
  if(deja){montrer(deja,true);return;}
  if(!FORMATS[f]){montrer(null,false);return;}
  montrer(FORMATS[f],false);
  fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({choix:FORMATS[f],appareil:ap||""})})
    .then(function(r){return r.json();})
    .then(function(j){if(!j.ok)return;var lab=j.choix||FORMATS[f];
      try{localStorage.setItem("hygie_vote_compet",lab);}catch(e){}
      if(j.deja) montrer(lab,true);})
    .catch(function(){});
})();
</script>
</body></html>
